<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การ์ดเชิญ · Worawan &amp; Chat</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="คุณได้รับการ์ดเชิญงานสมรส Worawan &amp; Chat">
<meta property="og:description" content="วันเสาร์ที่ 21 พฤศจิกายน 2569 · คริสตจักรเมืองทอง · แตะเพื่อเปิดการ์ด">
<meta name="theme-color" content="#FDFBF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Italiana&family=Parisienne&family=DM+Sans:wght@400;500&family=Trirong:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/card.css">
</head>
<body>

<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<div class="dust" id="dust" aria-hidden="true"></div>

<main class="page">

<!-- ============ SCENE 1 · the sealed envelope ============ -->
<section class="scene" id="scene">
  <p class="scene__hint" id="scene-hint" data-key="card.hint">แตะซองเพื่อเปิดการ์ด</p>

  <button type="button" class="envelope" id="envelope" aria-label="เปิดการ์ดเชิญ">
    <span class="env__back"></span>

    <span class="env__card" id="env-card">
      <span class="mini__eyebrow">the wedding of</span>
      <span class="mini__names">WORAWAN &amp; CHAT</span>
      <span class="mini__date">21 . 11 . 2026</span>
    </span>

    <span class="env__front"></span>

    <span class="env__flap"></span>

    <span class="env__seal">
      <svg viewBox="0 0 60 42" fill="none" stroke="var(--sky)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M28 20C20 8 6 6 4 15C2 23 16 26 28 20Z"/>
        <path d="M32 20C40 8 54 6 56 15C58 23 44 26 32 20Z"/>
        <ellipse cx="30" cy="20" rx="5" ry="4"/>
        <path d="M27 25C24 31 23 36 24 40"/>
        <path d="M33 25C36 31 37 36 36 40"/>
      </svg>
    </span>

    <span class="env__to">
      <span class="env__to-label" data-key="card.to">เรียน</span>
      <span class="env__to-name" id="env-name">ผู้มีเกียรติ</span>
    </span>
  </button>
</section>

<!-- ============ SCENE 2 · the invitation, top to bottom ============ -->
<section class="stage" id="stage" hidden>

  <article class="card" id="card">
    <svg class="card__frame" viewBox="0 0 400 600" preserveAspectRatio="none" aria-hidden="true">
      <rect x="11" y="11" width="378" height="578" fill="none" stroke="var(--nude)" stroke-width="0.7"/>
      <rect x="16" y="16" width="368" height="568" fill="none" stroke="var(--nude)" stroke-width="0.5" opacity=".55"/>
    </svg>

    <svg class="card__bow" viewBox="-108 -78 216 164" fill="var(--paper)" stroke="var(--sky)" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M-8 6C-26 30 -34 58 -28 76L-16 66L-6 78C-2 58 0 30 -2 10Z"/>
      <path d="M8 6C26 30 34 58 28 76L16 66L6 78C2 58 0 30 2 10Z"/>
      <path d="M-6 -2C-28 -50 -66 -72 -94 -62C-122 -52 -118 -14 -82 -1C-58 7 -20 11 -6 -2Z"/>
      <path d="M6 -2C28 -50 66 -72 94 -62C122 -52 118 -14 82 -1C58 7 20 11 6 -2Z"/>
      <path d="M-12 -5C-40 -28 -66 -40 -86 -37" fill="none" stroke="var(--sky-light)" stroke-width="0.8"/>
      <path d="M12 -5C40 -28 66 -40 86 -37" fill="none" stroke="var(--sky-light)" stroke-width="0.8"/>
      <ellipse cx="0" cy="2" rx="12" ry="10"/>
    </svg>

    <p class="c-eyebrow">the wedding of</p>
    <p class="c-name">WORAWAN</p>
    <p class="c-amp">and</p>
    <p class="c-name">CHAT</p>

    <div class="c-div" aria-hidden="true"><span></span><i></i><span></span></div>

    <p class="c-to" data-key="card.to">เรียน</p>
    <p class="c-who" id="guest-name">ผู้มีเกียรติ</p>
    <p class="c-msg" id="guest-msg" hidden></p>

    <svg class="c-rings" viewBox="0 0 46 24" fill="none" stroke="var(--sky)" stroke-width="1" aria-hidden="true">
      <circle cx="17" cy="12" r="9.4"/>
      <circle cx="29" cy="12" r="9.4"/>
    </svg>

    <p class="c-date">วันเสาร์ที่ 21 พฤศจิกายน 2569</p>
    <p class="c-venue">คริสตจักรเมืองทอง</p>
    <p class="c-time">พิธีสมรส เวลา 14:00 น.</p>

    <p class="c-foot-in" data-key="footer.apology">( ขออภัยหากมิได้มาเรียนเชิญด้วยตัวเอง )</p>
  </article>

  <div class="c-actions">
    <button type="button" class="btn" id="save-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11.5m0 0 4-4m-4 4-4-4"/><path d="M4 16.5v2.2a1.8 1.8 0 0 0 1.8 1.8h12.4a1.8 1.8 0 0 0 1.8-1.8v-2.2"/></svg>
      <span data-key="card.save">บันทึกการ์ด</span>
    </button>
    <a class="btn" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.2 10.4V19a1 1 0 0 0 1 1h9.6a1 1 0 0 0 1-1v-8.6"/></svg>
      <span data-key="card.home">รายละเอียดงาน</span>
    </a>
  </div>

  <div class="c-scroll" id="scroll-cue" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13m0 0 5-5m-5 5-5-5"/></svg>
  </div>

  <section class="ask">
    <h2 data-key="card.rsvp_heading">ตอบรับคำเชิญ</h2>
    <p class="ask__sub" id="rsvp-sub" data-key="card.deadline">กรุณาตอบรับภายในวันที่ 7 พฤศจิกายน 2569</p>

    <form id="rsvp-form" novalidate>
      <fieldset>
        <legend data-key="card.question">จะมาร่วมงานหรือไม่</legend>
        <div class="choice">
          <button type="button" data-attending="yes" aria-pressed="false" data-key="card.yes">มาร่วมงาน</button>
          <button type="button" data-attending="no" aria-pressed="false" data-key="card.no">ไม่สะดวก</button>
        </div>
      </fieldset>

      <label for="rsvp-note" data-key="card.note_label">ข้อความถึงบ่าวสาว</label>
      <textarea id="rsvp-note" maxlength="400" placeholder="อยากบอกอะไรกับบ่าวสาวไหม"></textarea>

      <button type="submit" class="btn btn--solid" id="rsvp-submit"><span data-key="card.submit">ส่งคำตอบ</span></button>
      <p class="status" id="rsvp-status" role="status"></p>
    </form>
  </section>

</section>

</main>

<script type="module" src="../assets/js/card.js"></script>
</body>
</html>
